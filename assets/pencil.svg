<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="pencilBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9EBB"/>
      <stop offset="50%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="pencilWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="pencilLead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="pencilEraser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <filter id="pencilShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#DB2777" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Shadow & Glow -->
  <ellipse cx="60" cy="104" rx="34" ry="7" fill="#F472B6" opacity="0.3"/>
  
  <!-- Main Pencil Body tilted 45 deg -->
  <g transform="translate(60,56) rotate(-42) translate(-60,-56)" filter="url(#pencilShadow)">
    <!-- Eraser -->
    <path d="M50 14 C50 8 70 8 70 14 L70 26 L50 26 Z" fill="url(#pencilEraser)"/>
    <!-- Metal band -->
    <rect x="49" y="26" width="22" height="8" rx="2" fill="#E5E7EB"/>
    <line x1="51" y1="30" x2="69" y2="30" stroke="#9CA3AF" stroke-width="1.5"/>
    
    <!-- Pencil Shaft -->
    <rect x="50" y="34" width="20" height="48" fill="url(#pencilBody)"/>
    <line x1="57" y1="34" x2="57" y2="82" stroke="#FFF" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="64" y1="34" x2="64" y2="82" stroke="#BE185D" stroke-opacity="0.3" stroke-width="2"/>
    
    <!-- Wooden tip -->
    <polygon points="50,82 70,82 60,102" fill="url(#pencilWood)"/>
    
    <!-- Graphite Lead Tip -->
    <polygon points="57,95 63,95 60,102" fill="url(#pencilLead)"/>
  </g>
  
  <!-- Cute sparkles around tip -->
  <path d="M28 88 L30 83 L35 85 L31 89 L33 94 L29 91 L25 93 L27 89 Z" fill="#F59E0B" opacity="0.85"/>
  <circle cx="92" cy="28" r="4" fill="#F472B6" opacity="0.75"/>
  <circle cx="86" cy="18" r="2.5" fill="#FDE68A"/>
</svg>
