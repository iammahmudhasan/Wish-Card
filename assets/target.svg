<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="ringOut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="ringMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7F3"/>
      <stop offset="100%" stop-color="#FBCFE8"/>
    </linearGradient>
    <linearGradient id="ringHeart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="arrowShaft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="targetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#E11D48" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Shadow -->
  <ellipse cx="60" cy="104" rx="36" ry="7" fill="#FB7185" opacity="0.25"/>

  <!-- Target Rings with 3D isometric tilt -->
  <g transform="translate(60,54) scale(1, 0.94) translate(-60,-54)" filter="url(#targetShadow)">
    <!-- Outer Ring -->
    <circle cx="60" cy="54" r="42" fill="url(#ringOut)"/>
    <circle cx="60" cy="54" r="42" stroke="#F97316" stroke-width="2" stroke-opacity="0.3"/>
    
    <!-- White Ring -->
    <circle cx="60" cy="54" r="32" fill="#FFFFFF"/>
    
    <!-- Pink Ring -->
    <circle cx="60" cy="54" r="22" fill="url(#ringMid)"/>
    
    <!-- Inner Bullseye Heart -->
    <circle cx="60" cy="54" r="12" fill="url(#ringHeart)"/>
    
    <!-- Heart in Center -->
    <path d="M60 50 C58 48 55 49 55 52 C55 55 60 58 60 58 C60 58 65 55 65 52 C65 49 62 48 60 50 Z" fill="#FFFFFF"/>
  </g>

  <!-- Cupid's Arrow hitting bullseye -->
  <g transform="translate(60,54) rotate(-35) translate(-60,-54)">
    <!-- Arrow Shaft -->
    <line x1="60" y1="54" x2="108" y2="54" stroke="url(#arrowShaft)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Feathers -->
    <path d="M96 46 L108 54 L96 62 L102 54 Z" fill="#FB7185"/>
    <path d="M86 48 L98 54 L86 60 L92 54 Z" fill="#F43F5E"/>
    
    <!-- Arrow Head Tip embedded in target -->
    <polygon points="56,54 64,50 64,58" fill="#F43F5E"/>
  </g>

  <!-- Sparkles -->
  <circle cx="28" cy="28" r="3" fill="#FBBF24"/>
  <circle cx="94" cy="88" r="2.5" fill="#F43F5E" opacity="0.8"/>
</svg>
